<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이메일 인증 완료</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f7f9;
    --text: #1a1d21;
    --text-muted: #5c646e;
    --border: #e3e6ea;
    --accent: #2f6fed;
    --ok: #1a7f4b;
    --ok-bg: #e7f6ed;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c;
      --surface: #1e2126;
      --text: #e8eaed;
      --text-muted: #a0a7b0;
      --border: #2e3238;
      --accent: #6b9bff;
      --ok: #5fd39a;
      --ok-bg: #14301f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c;
    --surface: #1e2126;
    --text: #e8eaed;
    --text-muted: #a0a7b0;
    --border: #2e3238;
    --accent: #6b9bff;
    --ok: #5fd39a;
    --ok-bg: #14301f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 72px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.7;
    font-size: 16px;
    word-break: keep-all;
  }

  main { max-width: 440px; margin: 0 auto; text-align: center; }

  .badge {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: var(--ok-bg);
    color: var(--ok);
    font-size: 30px;
    line-height: 64px;
    font-weight: 700;
  }

  h1 {
    font-size: 1.5rem;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }

  p { margin: 0 0 14px; color: var(--text-muted); }

  .next {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin: 28px 0 0;
    color: var(--text);
    font-weight: 600;
  }

  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  a { color: var(--accent); }
</style>
</head>
<body>
<main>

  <div class="badge">✓</div>

  <h1>이메일 인증이 완료됐어요</h1>
  <p>찌뿌둥 계정이 정상적으로 확인됐습니다.</p>

  <div class="next">
    이제 찌뿌둥 앱으로 돌아가<br>로그인해 주세요.
  </div>

  <footer>
    문제가 있으면 <a href="mailto:tkdals9063@gmail.com">tkdals9063@gmail.com</a>으로
    알려주세요.
  </footer>

</main>
</body>
</html>
